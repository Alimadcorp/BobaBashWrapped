<link rel="stylesheet" href="style.css">
</head>

<body>
<h1>THIS IS A SPIN WHEEL GAME</h1>
<label>Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <button onclick="sayHi()">Submit</button>
 <h2 id="result"></h2>
 <script>function sayHi() {
  let name = document.getElementById("name").value;
   document.getElementById("result").innerHTML =
  "Hi " + name + "!";
 }
    </script>
<h2>Dare to Spin?</h2>
     <h3>Let the Wheel Decide!</h3>
     
<div style="text-align:center;font-family:Arial,sans-serif">
  <h2>🎡 Spin the Wheel</h2>

  <input id="entries" placeholder="Pizza, Burger, Sushi, Pasta"
    style="width:280px;padding:10px">
  <p><small>Enter options separated by commas</small></p>

  <div style="position:relative;width:300px;margin:25px auto">
    <div style="position:absolute;top:-12px;left:140px;
      z-index:2;font-size:30px">▼</div>
    <canvas id="wheel" width="300" height="300"
      style="width:300px;max-width:100%"></canvas>
  </div>

  <button onclick="spin()"
    style="padding:12px 30px;font-size:18px;cursor:pointer">
    SPIN!
  </button>

  <h3 id="result">Your result will appear here!</h3>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
let rotation = 0;
let spinning = false;

function getItems() {
  return document.getElementById("entries").value
    .split(",").map(x => x.trim()).filter(Boolean);
}

function draw() {
  const items = getItems();
  const n = Math.max(items.length, 1);
  const arc = Math.PI * 2 / n;
  ctx.clearRect(0, 0, 300, 300);

  for (let i = 0; i < n; i++) {
    const start = rotation + i * arc - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(150, 150);
    ctx.arc(150, 150, 145, start, start + arc);
    ctx.closePath();
    ctx.fillStyle = `hsl(${i * 360 / n},75%,60%)`;
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(150, 150);
    ctx.rotate(start + arc / 2);
    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "right";
    ctx.shadowColor = "#333";
    ctx.shadowBlur = 2;
    const label = items[i] || "Add options";
    ctx.fillText(label.slice(0, 18), 130, 5);
    ctx.restore();
  }
}

function spin() {
  if (spinning) return;
  const items = getItems();
  if (!items.length) {
    document.getElementById("result").textContent =
      "Enter options separated by commas first!";
    return;
  }

  spinning = true;
  document.getElementById("result").textContent = "Spinning...";
  const n = items.length;
  const arc = 2 * Math.PI / n;
  const winner = Math.floor(Math.random() * n);
  const target = 2 * Math.PI * 6 +
    (2 * Math.PI - (winner + 0.5) * arc);
  const startRotation = rotation;
  const endRotation = startRotation + target;
  const startTime = performance.now();
  const duration = 4000;

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    rotation = startRotation + target * ease;
    draw();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = rotation % (2 * Math.PI);
      draw();
      document.getElementById("result").textContent =
        "🎉 Winner: " + items[winner] + "!";
      spinning = false;
    }
  }
  requestAnimationFrame(animate);
}

document.getElementById("entries").addEventListener("input", draw);
document.getElementById("entries").value =
  "Read your last message loud ,Prank call someone,Give a random person a foot massage,tell you secret ,click your embarrassing pic and post on your dp, Call your dad and tell her that you love him."
draw()

</script>



 
<h2 id="result"></h2>
</body>


  


</html>
