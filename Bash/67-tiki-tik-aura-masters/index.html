function update(step){hurt=Math.max(0,hurt-step);frame+=step;transformTime=Math.max(0,transformTime-step);if(godMode&&['run','fight'].includes(state)&&Math.random()<.75){trail.push({x:man.x+rand(0,50),y:man.y+rand(0,64),life:rand(9,22),r:rand(2,8)})}for(const t of trail){t.life-=step;t.x-=2.8*step}trail=trail.filter(t=>t.life>0);flash*=Math.pow(.84,step);shake*=Math.pow(.83,step);for(const p of particles){p.x+=p.vx*step;p.y+=p.vy*step;p.vy+=.23*step;p.life-=step}particles=particles.filter(p=>p.life>0);

 runSpeed=godMode?Math.min(37,21+score*.009):Math.min(13,6.3+score*.006);spawn-=step;if(spawn<=0){const emojis=['🥦','🥕','🍆','🥬','🌽'];obstacles.push({x:W+15,emoji:emojis[Math.floor(rand(0,emojis.length))]});spawn=rand(68,105)-Math.min(score*.026,24)}for(const o of obstacles){o.x-=runSpeed*step;if(rectOverlap(man.x+12,man.y+8,28,54,o.x+9,G-37,25,33)){if(godMode){o.x=-100;burst(man.x+50,G-35,'#ffe449',16)}else{die();break}}}obstacles=obstacles.filter(o=>o.x>-55)
 }

 for(const w of warnings){w.time-=step;if(w.time<=0){w.active-=step;if(w.active>0&&w.kind==='spike'&&rectOverlap(man.x+12,man.y+9,26,55,w.x-23,G-93,46,93))hitHero();if(w.active>0&&w.kind==='beam'&&rectOverlap(man.x+12,man.y+9,26,55,w.x-23,G-57,46,57))hitHero()}}

function text(s,x,y,size=20,color='#555'){ctx.fillStyle=color;ctx.font=`bold ${size}px Courier New,monospace`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function drawHero(){if(state==='dead')return;if(godMode){ctx.save();const cx=man.x+25,cy=man.y+30;const pulse=1+Math.sin(frame*.16)*.12;const gr=ctx.createRadialGradient(cx,cy,4,cx,cy,95*pulse);gr.addColorStop(0,'#fff6aa77');gr.addColorStop(.38,'#ffe20044');gr.addColorStop(1,'#ff850000');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(cx,cy,95*pulse,0,7);ctx.fill();ctx.strokeStyle='#ffd22c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,38+Math.sin(frame*.19)*4,0,7);ctx.stroke();ctx.restore()}const stride=state==='run'&&man.ground?Math.sin(frame*.4)*8:0;ctx.strokeStyle='#626262';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(man.x+17,man.y+43);ctx.lineTo(man.x+11-stride,man.y+67);ctx.moveTo(man.x+34,man.y+43);ctx.lineTo(man.x+39+stride,man.y+67);ctx.moveTo(man.x+9,man.y+42);ctx.lineTo(man.x+1,man.y+54);ctx.moveTo(man.x+39,man.y+42);ctx.lineTo(man.x+49,man.y+54);ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(man.x+25,man.y+24,23,0,Math.PI*2);ctx.clip();if(face)ctx.drawImage(face,0,0,face.width,face.height,man.x+2,man.y+1,46,46);else{ctx.fillStyle='#888';ctx.fillRect(man.x,man.y,50,50);text('M',man.x+25,man.y+32,24,'white')}ctx.restore();ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.arc(man.x+25,man.y+24,23,0,7);ctx.stroke()}

 if(bossIndex===0){for(let i=0;i<12;i++){const x=i*95;ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+60,90,x-30,220,x+20,G);ctx.stroke()}for(let i=0;i<14;i++){ctx.fillStyle=b.edge;ctx.beginPath();ctx.ellipse(i*83,35+Math.sin(i)*20,32,10,.5,0,7);ctx.fill()}}

 ctx.restore();ctx.strokeStyle=b.edge;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();ctx.fillStyle=b.edge+'33';ctx.fillRect(0,G,W,H-G);text(b.lair,480,27,18,b.edge)}
function drawBoss(){const b=boss(),by=190+Math.sin(bossClock*.045)*11;const halo=ctx.createRadialGradient(800,by,10,800,by,185);halo.addColorStop(0,b.edge+'66');halo.addColorStop(1,b.edge+'00');ctx.fillStyle=halo;ctx.fillRect(600,0,360,G);ctx.save();ctx.translate(800,by);if(immune>0&&Math.floor(immune/2)%2===0)ctx.globalAlpha=.38;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='155px serif';ctx.fillText(b.emoji,0,0);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-26,-5,15,13,0,0,7);ctx.ellipse(25,-5,15,13,0,0,7);ctx.fill();ctx.fillStyle='#be223b';ctx.beginPath();ctx.arc(-24,-5,7,0,7);ctx.arc(27,-5,7,0,7);ctx.fill();ctx.restore();

}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));const inLair=['intro','fight','won'].includes(state);if(inLair)drawLair();else{ctx.fillStyle='#fafafa';ctx.fillRect(-35,-35,W+70,H+70);ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();ctx.fillStyle='#777';for(let x=-(frame*runSpeed)%60;x<W;x+=60)ctx.fillRect(x,G+17,20,2)}

 if(state==='dead'){text('MUSTAFA HAS BEEN OBLITERATED',480,118,28,'#ab1826');text('BY A VEGETABLE.',480,155,25,'#ab1826');text('GAME OVER  •  SCORE '+Math.floor(score),480,202,20);text('SPACE OR TAP TO RESTART',480,246,17,'#777')}

 ctx.restore()}
