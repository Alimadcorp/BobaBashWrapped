<!DOCTYPE html>
<html>
<head>
    <title>Coffee Hut</title>

    <style>
        body {
            background: #f5e6d3;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        h1 {
            background: #4b2e1e;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h2 {
            color: #6f4225;
        }

        button {
            background: #6f4225;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }

        footer {
            background: #4b2e1e;
            color: white;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>    

</head>

<body>

    <h1>CHAI DHABA☕</h1>

    <div class="container">

        <div class="box">
            <h2>Adrak wali chai☕</h2>
            <p>Enjoy!</p>
            <p>Price: 80/pkr</p>
            <button>Order Now</button>
        </div>

        <div class="box">
            <h2>Green tea ☕</h2>
            <p>Enjoy!</p>
            <p>Price:120/pkr</p>
            <button>Order Now</button>
        </div>

        <div class="box">
            <h2>Lacha Parathaa😘😛🤤</h2>
            <p>Price:90/pkr</p>
             <button>Order Now</button>
        </div>

        <div class="box">
            <h2>cheese paratha🤤😘😛</h2>
            <p>Price:320/pkr</p>
              <button>Order Now

        </div>

    </div>

    <footer>
        Love and chai from Ayyan👌😊
    </footer>

</body>
</html>
