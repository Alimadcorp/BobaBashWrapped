<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boba Bash Lahore Wrapped</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="https://bash.hackclub.com/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;700&family=Phantom+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #cbebfa;
        background-image: linear-gradient(
            rgba(180, 220, 240, 0.5) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(180, 220, 240, 0.5) 1px, transparent 1px);
        background-size: 30px 30px;
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        color: #252429;
        padding-bottom: 60px;
      }
      header {
        background: #fff;
        border-bottom: 2px solid #252429;
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .flag {
        background: #ec3750;
        color: white;
        font-weight: 800;
        padding: 6px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 18px;
        letter-spacing: -0.5px;
        display: inline-block;
        transform: rotate(-2deg);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
      }
      nav a {
        text-decoration: none;
        color: #252429;
        font-weight: 700;
      }
      .main-layout {
        max-width: 1100px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 0 20px;
      }
      .card {
        background: #fdfaf0;
        border: 2px solid #252429;
        border-radius: 8px;
        box-shadow: 5px 5px 0px #252429;
        padding: 30px;
      }
      h1 {
        color: #338da8;
        font-size: 42px;
        margin-bottom: 15px;
        line-height: 1.1;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin: 25px 0 35px 0;
      }
      .stat-box {
        background: #fff;
        border: 2px solid #252429;
        padding: 15px;
        border-radius: 6px;
        text-align: center;
        box-shadow: 3px 3px 0px #252429;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .stat-number {
        font-size: 36px;
        font-weight: 800;
        color: #ec3750;
      }
      .stat-label {
        font-size: 13px;
        text-transform: uppercase;
        font-weight: 700;
        color: #555;
        margin-top: 4px;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .action-buttons {
        display: flex;
        gap: 15px;
        margin: 30px 0;
        flex-wrap: wrap;
      }
      .action-btn {
        background: #e0f2fe;
        color: #0369a1;
        border: 2px solid #252429;
        padding: 15px 24px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 18px;
        text-align: center;
        flex: 1;
        min-width: 200px;
        box-shadow: 4px 4px 0px #252429;
        transition: transform 0.1s, box-shadow 0.1s;
      }
      .action-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #252429;
      }
      .ig-btn {
        background: #fce7f3;
        color: #be185d;
      }
      .comments-container {
        font-family: 'Host Grotesk', sans-serif;
        margin-top: 40px;
        border: 2px solid #252429;
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
        box-shadow: 5px 5px 0px #252429;
      }
      .comments-container h3 {
        background: #f1c40f;
        padding: 15px 20px;
        border-bottom: 2px solid #252429;
        font-size: 22px;
        margin: 0;
        color: #252429;
      }
      .comments-list {
        height: 350px;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #fafafa;
      }
      .comment-bubble {
        background: #ffedd5;
        border: 2px solid #9a3412;
        padding: 10px 14px;
        border-radius: 6px;
        color: #431407;
        max-width: 85%;
        align-self: flex-start;
        font-size: 16px;
        line-height: 1.4;
      }
      .comment-time {
        font-size: 11px;
        color: #9a3412;
        margin-bottom: 4px;
        display: block;
        font-weight: 700;
        opacity: 0.8;
      }
      .comment-input-area {
        display: flex;
        border-top: 2px solid #252429;
        padding: 15px;
        background: #fff;
        gap: 10px;
        flex-wrap: wrap;
      }
      #comment-text {
        flex: 1;
        padding: 12px;
        border: 2px solid #252429;
        border-radius: 6px;
        font-family: 'Host Grotesk', sans-serif;
        font-size: 16px;
        outline: none;
        min-width: 150px;
      }
      #comment-text:focus {
        border-color: #ec3750;
      }
      #send-comment-btn {
        background: #ec3750;
        color: white;
        border: 2px solid #252429;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        font-family: 'Host Grotesk', sans-serif;
        font-size: 16px;
        transition: transform 0.1s;
      }
      #send-comment-btn:hover {
        background: #e11d48;
      }
      #send-comment-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      @media (max-width: 600px) {
        header {
          flex-direction: column;
          gap: 15px;
          padding: 16px;
        }
        nav {
          justify-content: center;
        }
        .main-layout {
          margin: 20px auto;
          padding: 0 15px;
        }
        .card {
          padding: 20px;
        }
        h1 {
          font-size: 32px;
        }
        .stats-grid {
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        }
        .action-buttons {
          flex-direction: column;
        }
        .action-btn {
          width: 100%;
        }
        .comment-input-area {
          flex-direction: column;
        }
        #send-comment-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="https://hackclub.com" class="flag">HACK CLUB</a>
      <nav>
        <a href="https://bash.hackclub.com/events/lahore/submissions">pre-event ships</a>
        <a href="/ships">day-of ships</a>
      </nav>
    </header>

    <div class="main-layout">
      <div class="card">
        <h1>Boba Bash Lahore Wrapped</h1>
        <p style="font-size: 18px; color: #444">
          Make a website, hang out with friends, get free boba!
        </p>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-number" id="checked-in-count">-</div>
            <div class="stat-label">Total Checked In</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="pre-count">-</div>
            <div class="stat-label">Pre-Event Ships</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="post-count">-</div>
            <div class="stat-label">Day-Of Ships</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="avg-rating">-</div>
            <div class="stat-label">Avg NPS</div>
          </div>
        </div>

        <div class="action-buttons">
          <a href="/ships" class="action-btn">Day-Of Ships</a>
          <a href="https://bash.hackclub.com/events/lahore/submissions" class="action-btn">Pre-Event Ships</a>
          <a href="https://instagram.com/bobabash_lahore" target="_blank" class="action-btn ig-btn">Instagram</a>
        </div>

        <div class="comments-container">
          <h3>Comments on the event?</h3>
          <div id="comments-list" class="comments-list">
            <p style="text-align: center; color: #666; margin-top: 20px">
              Loading comments...
            </p>
          </div>
          <div class="comment-input-area">
            <input
              type="text"
              id="comment-text"
              placeholder="Drop a message..."
              autocomplete="off"
            />
            <button id="send-comment-btn" onclick="postComment()">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script>
    let lc = { logs: [] }; // last loaded comments
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
          if (data.stats) {
            document.getElementById('checked-in-count').innerText = data.stats.checkedIn || '-'
            document.getElementById('pre-count').innerText = data.stats.preCount || '-'
            document.getElementById('post-count').innerText = data.postEvent ? data.postEvent.length : '-'
            document.getElementById('avg-rating').innerText = (data.stats.avgRating || '-') + '/10'
          }
        })
        .catch(err => console.error('Error loading stats:', err))

      const bw = atob('ZnVjay5zaGl0LmJpdGNoLmFzc2hvbGUuY3VudC5kaWNrLnB1c3N5LmJhc3RhcmQuc2x1dC53aG9yZS5jcmFw').split('.')

      function containsBadWords(text) {
        const lowerText = text.toLowerCase()
        return bw.some(word => lowerText.includes(word))
      }

      function formatTime(dateInput) {
        const date = new Date(dateInput)
        const now = new Date()
        const seconds = Math.floor((now - date) / 1000)

        if (seconds < 60) return 'just now'

        const minutes = Math.floor(seconds / 60)
        if (minutes < 60) return minutes === 1 ? '1 minute ago' : `${minutes} minutes ago`

        const hours = Math.floor(minutes / 60)
        if (hours < 24) return hours === 1 ? '1 hour ago' : `${hours} hours ago`

        const days = Math.floor(hours / 24)
        return days === 1 ? '1 day ago' : `${days} days ago`
      }

      async function loadComments() {
        try {
          const res = await fetch('https://log.alimad.co/api/pull?channel=bblcm')
          const data = await res.json()
          const list = document.getElementById('comments-list')

          if (data.logs && data.logs.length > 0) { 
            if (lc.logs.length != data.logs.length) {
            list.innerHTML = ''
            data.logs.forEach(log => {
              const div = document.createElement('div')
              div.className = 'comment-bubble'

              const timeSpan = document.createElement('span')
              timeSpan.className = 'comment-time'
              timeSpan.innerText = formatTime(log.time)

              const textNode = document.createTextNode(log.text)

              div.appendChild(timeSpan)
              div.appendChild(textNode)
              list.appendChild(div)
            })
            list.scrollTop = list.scrollHeight
            }
          } else {
            list.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">No comments yet. Be the first!</p>'
          }
          lc = data;
        } catch (err) {
          console.error('Error loading comments:', err)
          document.getElementById('comments-list').innerHTML = '<p style="text-align:center; color:#ec3750; margin-top:20px;">Failed to load comments.</p>'
        }
      }

      async function postComment() {
        const input = document.getElementById('comment-text')
        let text = input.value.trim()

        if (!text) return

        if (containsBadWords(text)) {
          alert('Please keep the comments clean :sob-pray:')
          return
        }

        const btn = document.getElementById('send-comment-btn')
        btn.disabled = true
        btn.innerText = '...'

        try {
          await fetch('https://log.alimad.co/api/log?channel=bblcm&text=' + encodeURIComponent(text))
          input.value = ''
          await loadComments()
        } catch (err) {
          alert('Failed to send comment. Please try again.')
        } finally {
          btn.disabled = false
          btn.innerText = 'Send'
        }
      }

      document
        .getElementById('comment-text')
        .addEventListener('keypress', function (e) {
          if (e.key === 'Enter') {
            postComment()
          }
        })

      loadComments()
      setInterval(loadComments, 8000)
    </script>
  </body>
</html>
